name: Validate extension

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Check generated parser is current
        run: |
          npm run generate
          git diff --exit-code -- src
      - run: npm run check
      - run: npm run check:release
      - run: npm audit --audit-level=high
      - name: Install verified WASI SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk_archive="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux.tar.gz"
          curl --fail --location --retry 2 \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz \
            --output "$sdk_archive"
          printf '%s  %s\n' b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4 "$sdk_archive" | sha256sum --check
          tar -xzf "$sdk_archive" -C "$RUNNER_TEMP"
          printf 'WASI_SDK_PATH=%s\n' "$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - run: npm run build:wasm
